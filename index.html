<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>GPS Scooter</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!-- Comportamento em tela cheia/standalone ao adicionar à Tela de Início no iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GPS Scooter" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Splash estático, visível enquanto o bundle JS carrega/hidrata; removido pelo main.tsx assim que o React montar. -->
    <div
      id="splash"
      style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #0f172a"
    >
      <img src="/icons/icon-192.png" width="112" height="112" alt="GPS Scooter" />
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
