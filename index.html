<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <!--
      Cor inicial da barra do sistema. Vale APENAS até o React montar: a partir
      daí `useUserPreferences` a sincroniza com o tema escolhido. Branco aqui
      porque é a cor do splash abaixo — deixá-la escura fazia a barra piscar de
      preto para branco no instante da abertura.
    -->
    <meta name="theme-color" content="#FFFFFF" />
    <title>GPS Scooter</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!--
      `black-translucent`: a página se estende POR BAIXO da barra de status do
      iOS, e o mapa continua aparecendo atrás dela. É o que dá a barra de
      status transparente.

      Foi trocado por `default` junto com a logo nova, e `default` faz o
      oposto: reserva uma faixa opaca no topo e encurta a viewport. O efeito
      colateral é duplo — a barra vira uma tarja sólida e
      `env(safe-area-inset-top)` zera, então o degradê de leitura passa a
      começar na borda da tela em vez de acompanhar o recorte do aparelho.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Comportamento em tela cheia/standalone ao adicionar à Tela de Início no iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GPS Scooter" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Splash estático, visível enquanto o bundle JS carrega; removido pelo
      main.tsx assim que o React monta.

      Fundo BRANCO, acompanhando o fundo da própria logo — antes era
      #0A0E1A, e a marca (que é desenhada sobre branco) aparecia dentro de um
      quadrado claro recortado no meio de uma tela preta.

      `decoding="sync"` na marca: sem isso o navegador pode decodificar a
      imagem fora do quadro atual e pintar o fundo branco antes dela, dando um
      lampejo de tela vazia antes da logo aparecer.
    -->
    <div
      id="splash"
      style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #FFFFFF"
    >
      <img
        src="/icons/icon-192.png"
        width="128"
        height="128"
        decoding="sync"
        alt="GPS Scooter"
        style="display: block"
      />
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
