<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script><style>body{padding:16px;font-family:var(--font-core)}.g{display:flex;gap:22px;color:var(--text-secondary)}.n{font-size:10px;color:var(--text-tertiary);text-align:center;margin-top:6px;font-family:var(--font-mono)}</style></head><body>
<div class="g" id="g"></div>
<script>
const names=["search","map","star","clock","map-pin","navigation","chevron-right","arrow-left","circle-x","house","briefcase","route","bike","log-out"];
document.getElementById("g").innerHTML=names.map(n=>'<div><i data-lucide="'+n+'"></i><div class="n">'+n+'</div></div>').join("");
lucide.createIcons({attrs:{width:26,height:26,"stroke-width":2}});
</script></body></html>
