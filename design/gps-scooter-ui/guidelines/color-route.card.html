<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;font-family:var(--font-core)}.r{display:flex;align-items:center;gap:14px;margin-bottom:14px}.l{height:10px;width:180px;border-radius:999px}.t{font-size:14px;color:var(--text-secondary)}</style></head><body>
<div class="r"><span class="l" style="background:var(--route-active);box-shadow:var(--glow-route)"></span><span class="t"><b style="color:#fff">Active</b> — the line you are riding</span></div>
<div class="r"><span class="l" style="background:var(--route-recommended)"></span><span class="t"><b style="color:#fff">Recommended</b> — bike lanes and calm streets</span></div>
<div class="r"><span class="l" style="background:repeating-linear-gradient(90deg,var(--route-caution) 0 10px,transparent 10px 18px)"></span><span class="t"><b style="color:#fff">Caution</b> — mixed traffic, no bike lane</span></div>
<div class="r" style="margin:0"><span class="l" style="background:repeating-linear-gradient(90deg,var(--route-hazard) 0 10px,transparent 10px 18px)"></span><span class="t"><b style="color:#fff">Hazard</b> — not recommended for scooters</span></div>
</body></html>
