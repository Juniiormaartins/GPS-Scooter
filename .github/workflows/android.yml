name: Android APK

# Gera o app Android (casca Capacitor que abre o site publicado) e o assina.
# - Em qualquer branch: compila e guarda o APK como "artifact" da execucao.
# - Na main: alem disso publica na Release "android-latest", cujo link e fixo:
#   https://github.com/Juniiormaartins/gps-scooter/releases/download/android-latest/GPS-Scooter.apk

on:
  push:
    paths:
      - 'android-shell/**'
      - 'public/icons/icon-512.png'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar o Capacitor
        working-directory: android-shell
        run: npm install --no-audit --no-fund

      - name: Gerar o projeto Android
        working-directory: android-shell
        run: npx cap add android

      - name: Aplicar os ajustes do GPS Scooter
        working-directory: android-shell
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: node scripts/patch-android.mjs

      - name: Compilar
        working-directory: android-shell/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Assinar
        working-directory: android-shell
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Sem chave de assinatura fixa nos secrets: usando uma chave temporaria. Este APK NAO atualiza por cima de outro; e preciso desinstalar o anterior."
            KS_PASS=temporaria; KS_ALIAS=temporaria
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GPS Scooter temporario"
          fi
          export KS_PASS
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" \
            --key-pass env:KS_PASS --out GPS-Scooter.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs GPS-Scooter.apk
          ls -l GPS-Scooter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Scooter-apk
          path: android-shell/GPS-Scooter.apk

      - name: Publicar na Release (so na main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest android-shell/GPS-Scooter.apk \
            --title "GPS Scooter (Android) - build ${{ github.run_number }}" \
            --notes "APK assinado, gerado de ${{ github.sha }}. Baixe pelo celular e instale." \
            --target "${{ github.sha }}"
